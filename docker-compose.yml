# StudyHub — full stack in one command: docker compose up
#
# Services:
#   api       — Go REST API + frontend static files  (port 8080)
#   analytics — Python FastAPI microservice          (port 8001, internal only)
#   postgres  — PostgreSQL 16                        (port 5432, internal)

services:

  # ── Go API ─────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DATABASE_URL: postgres://studyhub:${POSTGRES_PASSWORD:-changeme}@postgres:5432/studyhub?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:8080}
      ANALYTICS_SERVICE_URL: http://analytics:8001
    depends_on:
      postgres:
        condition: service_healthy
      analytics:
        condition: service_healthy
    restart: unless-stopped

  # ── Python Analytics Microservice ──────────────────────────────────────────
  analytics:
    build:
      context: services/analytics
      dockerfile: Dockerfile
    expose:
      - "8001"   # internal only — not exposed to host
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: studyhub
      POSTGRES_USER: studyhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"   # internal only — not exposed to host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyhub -d studyhub"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  postgres_data:

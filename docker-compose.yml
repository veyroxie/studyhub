# StudyHub — full stack in one command: docker compose up
#
# Services:
#   api       — Go REST API + frontend static files  (port 8080)
#   analytics — Python FastAPI microservice          (port 8001, internal only)
#   postgres  — PostgreSQL 16                        (port 5432, internal)

# Bounded container logs so json-file logs can't fill the droplet disk (which
# would also take Postgres down). Applied to every service via the anchor.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ── Go API ─────────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    ports:
      # Loopback-only: Docker's DNAT rules bypass ufw, so a plain "8080:8080"
      # exposes the API over cleartext to the internet. Caddy proxies to
      # localhost:8080, which this still serves.
      - "127.0.0.1:8080:8080"
    volumes:
      - ./backups:/app/backups
      # Payment proofs live here; without this mount every deploy recreated the
      # container and silently destroyed all uploaded files.
      - ./uploads:/app/uploads
    environment:
      PORT: 8080
      # Business runs in Malaysia (UTC+8). Without this the container is UTC and
      # dates near midnight (attendance, invoices, early-bird cutoff) are wrong.
      TZ: ${TZ:-Asia/Kuala_Lumpur}
      # Required secrets — compose refuses to start if unset/empty (":?"),
      # so a missing .env fails loudly instead of silently running with a
      # committed placeholder secret anyone could forge admin JWTs with.
      DATABASE_URL: ${DATABASE_URL:-postgres://studyhub:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/studyhub?sslmode=disable}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (use a long random value, min 16 chars)}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN:-http://localhost:8080}
      # Development by default: production is opt-in (set in the droplet's .env).
      # A forgotten variable must fail SAFE — the July 31 incident was a dev box
      # booting as production and draining the real email queue.
      APP_ENV: ${APP_ENV:-development}
      ANALYTICS_SERVICE_URL: http://analytics:8001
      # Email (Resend) — leave blank to run in dev mode (emails logged to stdout)
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      # Dev-safe defaults: production values (live sender, real domain) are set
      # explicitly in the droplet's .env, never inherited from a fallback.
      EMAIL_FROM: ${EMAIL_FROM:-StudyHub Dev <dev@localhost>}
      APP_URL: ${APP_URL:-http://localhost:8080}
      # Recipient for the built-in health self-check alerts (disk, backups,
      # stuck email queue). Empty disables alerting.
      ALERT_EMAIL: ${ALERT_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-}
      # Web push (VAPID) — leave blank to disable push (email + in-app still work)
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      # DO Spaces backup (optional — set in .env)
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_HOST: ${S3_HOST:-sgp1.digitaloceanspaces.com}
    depends_on:
      postgres:
        condition: service_healthy
      analytics:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"

  # ── Python Analytics Microservice ──────────────────────────────────────────
  analytics:
    build:
      context: services/analytics
      dockerfile: Dockerfile
    expose:
      - "8001"   # internal only — not exposed to host
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: studyhub
      POSTGRES_USER: studyhub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    # Tuned for a 512MB-768MB container on a small droplet. Defaults
    # (shared_buffers=128MB, work_mem=4MB) leave Postgres I/O-bound on
    # the snapshot endpoint; these settings give it real headroom for
    # the bulk SELECTs without OOM-killing the box.
    command:
      - postgres
      # Cap below the Go pool's headroom: 60 connections x work_mem=8MB fits the
      # 768M limit; the old default (100) exceeded it and the app pool (150)
      # exceeded even that, turning load spikes into hard connection errors.
      - -c
      - max_connections=60
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=512MB
      - -c
      - work_mem=8MB
      - -c
      - maintenance_work_mem=64MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"   # internal only — not exposed to host
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studyhub -d studyhub"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 768M
          cpus: "1.0"

volumes:
  postgres_data:
